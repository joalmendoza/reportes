<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Reportes Técnicos</title>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; }
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
    .hidden { display: none !important; }
    .input-field { width: 100%; padding: 12px; margin-top: 4px; margin-bottom: 16px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    .btn { width: 100%; background: #2563eb; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn:disabled { opacity: 0.6; }
    .canvas-container { border: 2px dashed #9ca3af; border-radius: 8px; background: #fafafa; position: relative; margin-bottom: 8px; touch-action: none; }
    canvas { width: 100%; height: 150px; display: block; border-radius: 8px; }
    .firma-img { width: 100%; height: auto; display: block; border-radius: 8px; }
    .btn-clear { background: #6b7280; padding: 6px 12px; font-size: 12px; margin-bottom: 16px; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .error-msg { color: #ef4444; font-weight: bold; margin-bottom: 12px; font-size: 14px; text-align: center; }
    .badge { display: inline-block; padding: 4px 8px; background: #e0f2fe; color: #0369a1; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
  </style>

  <!-- LIBRERÍAS (ya no se usa el SDK de Firebase: se habla directo con la API, más liviano y estable) -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

  <!-- PANTALLA 1: INICIO DE SESIÓN -->
  <div id="login-screen" class="card">
    <h2 id="login-title" style="text-align: center; margin-bottom: 20px;">Acceso de Técnicos</h2>
    <p id="login-nota" style="text-align:center; font-size:14px; color:#6b7280; margin:-10px 0 14px;"></p>
    <div id="error-message" class="error-msg"></div>

    <div>
      <label style="font-weight: bold; font-size: 14px;">Correo Electrónico</label>
      <input type="email" id="email" class="input-field" placeholder="correo@empresa.com" value="joalmendoza@gmail.com">

      <label style="font-weight: bold; font-size: 14px;">Contraseña</label>
      <input type="password" id="password" class="input-field" placeholder="••••••••">

      <button type="button" id="btn-submit-login" class="btn" onclick="procesarLogin()">Iniciar Sesión</button>
      <p id="diag" style="text-align:center; font-size:11px; color:#9ca3af; margin:14px 0 0;">v5</p>
    </div>
  </div>

  <!-- PANTALLA DEL COORDINADOR (sesión activa) -->
  <div id="home-coord" class="card hidden" style="text-align:center;">
    <h2 style="margin-top:0;">Sesión de coordinador</h2>
    <p id="home-coord-msg" style="font-weight:bold; color:#16a34a;"></p>
    <p style="font-size:14px; color:#6b7280;">Tu sesión sigue activa. Para aprobar otro reporte, abre su enlace desde WhatsApp.</p>
    <button type="button" id="btn-logout-home" class="btn" style="background:#ef4444;">Cerrar sesión</button>
  </div>

  <!-- PANTALLA 2: FORMULARIO -->
  <div id="main-form-screen" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px;">
      <span style="font-size: 12px; color: #6b7280; font-weight: bold;" id="user-display">Modo Consulta</span>
      <button id="btn-logout" style="background: none; border: none; color: #ef4444; font-size: 12px; font-weight: bold; cursor: pointer;">Salir</button>
    </div>

    <div id="view-badge" class="badge">Modo Técnico</div>
    <h2 id="view-title" style="margin-top: 0; margin-bottom: 16px; color: #111827;">Formulario de Servicio</h2>

    <div id="pdf-area" style="padding: 10px; background: white;">
      <label style="font-weight: bold; font-size: 14px;">Nombre del Cliente</label>
      <input type="text" id="client-name" class="input-field" placeholder="Ej. Juan Pérez">

      <label style="font-weight: bold; font-size: 14px;">Descripción del Trabajo Realizado</label>
      <textarea id="work-description" class="input-field" rows="4" placeholder="Detalle técnico..." style="resize: none; font-family: sans-serif;"></textarea>

      <!-- Firma Técnico -->
      <div id="block-tech-sig">
        <label style="font-weight: bold; font-size: 14px;">Firma del Técnico</label>
        <div class="canvas-container" id="container-canvas-tech">
          <canvas id="signature-tech"></canvas>
          <img id="img-tech-sig" class="hidden firma-img" alt="Firma Técnico">
        </div>
        <div id="fecha-tec" style="font-size:13px; color:#374151; line-height:1.6; margin:6px 0 10px;"></div>
        <button type="button" id="btn-clear-tech" class="btn-clear">Borrar Firma</button>
      </div>

      <!-- Firma Coordinador -->
      <div id="block-admin-sig" class="hidden">
        <label style="font-weight: bold; font-size: 14px; color: #2563eb;">Firma de Aprobación (Coordinador)</label>
        <div class="canvas-container">
          <canvas id="signature-admin"></canvas>
          <img id="img-admin-sig" class="hidden firma-img" alt="Firma Coordinador">
        </div>
        <div id="fecha-adm" style="font-size:13px; color:#374151; line-height:1.6; margin:6px 0 10px;"></div>
        <button type="button" id="btn-clear-admin" class="btn-clear">Borrar Firma</button>
      </div>
    </div>

    <button type="button" id="btn-submit-main" class="btn" style="background: #16a34a;">Enviar a WhatsApp</button>
  </div>

  <script>
    window.onerror = function(message, source, lineno) {
      alert("Error en ejecución: " + message + "\nLínea: " + lineno);
      return false;
    };

    // ---------- CONFIGURACIÓN ----------
    var API_KEY = "AIzaSyAWSDgj6gQjGyOYblCIBXKC15s7Y7qnnsA";
    var PROYECTO = "appformatosmtto";
    var WHATSAPP_COORDINADOR = "573105398897";
    var CORREOS_DESTINO = "jorge.mendoza@carval.com.co, formatosmtto.carval@gmail.com";

    var EMAILJS_SERVICE_ID = "service_m3xvu2j";
    var EMAILJS_TEMPLATE_ID = "template_loi9vam";
    // La primera letra puede ser "I" mayúscula o "l" minúscula, y la "O" puede ser cero.
    // La app prueba las variantes hasta que una funcione.
    var EMAILJS_PUBLIC_KEYS = [
      "I_6FNZetkO_cSgx5A",
      "l_6FNZetkO_cSgx5A",
      "I_6FNZetk0_cSgx5A",
      "l_6FNZetk0_cSgx5A"
    ];
    if (window.emailjs) { emailjs.init(EMAILJS_PUBLIC_KEYS[0]); }

    // ===== INICIO BLOQUE API =====
    var FS_BASE = "https://firestore.googleapis.com/v1/projects/" + PROYECTO + "/databases/(default)/documents";
    var sesion = null; // { email, idToken, refreshToken, expira }

    function guardarSesion(s) {
      sesion = s;
      try {
        if (s) localStorage.setItem('sesionTecnico', JSON.stringify(s));
        else localStorage.removeItem('sesionTecnico');
      } catch (e) {}
    }

    function leerSesion() {
      try {
        var t = localStorage.getItem('sesionTecnico');
        return t ? JSON.parse(t) : null;
      } catch (e) { return null; }
    }

    // fetch con tiempo límite y errores claros
    async function pedir(url, opciones, limiteMs) {
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, limiteMs || 20000);
      try {
        var cfg = Object.assign({}, opciones || {});
        if (ctrl) cfg.signal = ctrl.signal;
        var r = await fetch(url, cfg);
        var data = {};
        try { data = await r.json(); } catch (e) {}
        if (!r.ok) {
          var err = new Error((data.error && data.error.message) || ("HTTP " + r.status));
          err.status = r.status;
          err.apiMessage = (data.error && data.error.message) || "";
          throw err;
        }
        return data;
      } catch (e) {
        if (e && e.name === 'AbortError') {
          var t = new Error("Sin respuesta del servidor");
          t.code = 'timeout';
          throw t;
        }
        if (e && e.name === 'TypeError') {
          var n = new Error("Sin conexión");
          n.code = 'red';
          throw n;
        }
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    function aCampos(obj) {
      var f = {};
      Object.keys(obj).forEach(function(k) { f[k] = { stringValue: String(obj[k] == null ? '' : obj[k]) }; });
      return f;
    }

    function deCampos(fields) {
      var o = {};
      Object.keys(fields || {}).forEach(function(k) {
        var v = fields[k];
        o[k] = (v && v.stringValue !== undefined) ? v.stringValue : '';
      });
      return o;
    }

    function nuevoId() {
      var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      var out = "";
      var arr = new Uint8Array(20);
      (window.crypto || window.msCrypto).getRandomValues(arr);
      for (var i = 0; i < 20; i++) out += chars.charAt(arr[i] % chars.length);
      return out;
    }

    async function iniciarSesionApi(email, clave, rol) {
      var d = await pedir("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: clave, returnSecureToken: true })
      });
      guardarSesion({
        rol: rol || 'tecnico',
        email: d.email,
        idToken: d.idToken,
        refreshToken: d.refreshToken,
        expira: Date.now() + (parseInt(d.expiresIn, 10) - 120) * 1000
      });
    }

    async function tokenValido() {
      if (!sesion) { var e0 = new Error("Sesión cerrada"); e0.code = 'sin-sesion'; throw e0; }
      if (Date.now() < sesion.expira) return sesion.idToken;
      var d;
      try {
        d = await pedir("https://securetoken.googleapis.com/v1/token?key=" + API_KEY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(sesion.refreshToken)
        });
      } catch (e) {
        if (e.status === 400 || e.status === 401) { e.code = 'sin-sesion'; }
        throw e;
      }
      guardarSesion({
        rol: sesion.rol,
        email: sesion.email,
        idToken: d.id_token,
        refreshToken: d.refresh_token,
        expira: Date.now() + (parseInt(d.expires_in, 10) - 120) * 1000
      });
      return sesion.idToken;
    }

    async function crearReporte(datos) {
      var token = await tokenValido();
      var id = nuevoId();
      await pedir(FS_BASE + "/reportes?documentId=" + id + "&key=" + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ fields: aCampos(datos) })
      });
      return id;
    }

    async function leerReporte(id) {
      var d = await pedir(FS_BASE + "/reportes/" + encodeURIComponent(id) + "?key=" + API_KEY);
      return deCampos(d.fields);
    }

    // Solo se pueden agregar estos 4 campos; la firma del técnico no se puede tocar
    async function firmarReporte(id, datos) {
      var token = await tokenValido();
      var mascara = ['firmaAdm', 'fechaApr', 'horaApr', 'estado']
        .map(function(k) { return "updateMask.fieldPaths=" + k; }).join("&");
      await pedir(FS_BASE + "/reportes/" + encodeURIComponent(id) + "?" + mascara + "&key=" + API_KEY, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ fields: aCampos(datos) })
      });
    }
    // ===== FIN BLOQUE API =====

    var urlParams = new URLSearchParams(window.location.search);
    var modo = urlParams.get('mode');
    var reporteId = urlParams.get('id');
    var modoAprobar = (modo === 'aprobar');
    var modoVer = (modo === 'ver');
    var baseUrl = window.location.origin + window.location.pathname;

    var padTech, padAdmin;

    // Fecha y hora en horario de Colombia
    function ahora() {
      var d = new Date();
      return {
        fecha: d.toLocaleDateString('es-CO', { timeZone: 'America/Bogota', day: '2-digit', month: '2-digit', year: 'numeric' }),
        hora: d.toLocaleTimeString('es-CO', { timeZone: 'America/Bogota', hour: '2-digit', minute: '2-digit', hour12: true })
      };
    }

    function pintarFechas(repFecha, repHora, aprFecha, aprHora) {
      document.getElementById('fecha-tec').innerHTML =
        repFecha ? "<b>Fecha y hora del reporte:</b> " + repFecha + " - " + repHora : "";
      document.getElementById('fecha-adm').innerHTML =
        aprFecha ? "<b>Visto bueno del coordinador:</b> " + aprFecha + " - " + aprHora : "";
    }

    // Convierte la firma dibujada en una imagen JPEG liviana
    function firmaImagen(canvas, ancho, calidad) {
      var h = Math.round(ancho * canvas.height / canvas.width);
      var c = document.createElement('canvas');
      c.width = ancho;
      c.height = h;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, ancho, h);
      ctx.drawImage(canvas, 0, 0, ancho, h);
      return c.toDataURL('image/jpeg', calidad);
    }

    // Envía el correo probando las variantes de la llave de EmailJS
    async function enviarCorreo(params) {
      var ultimoError = null;
      for (var i = 0; i < EMAILJS_PUBLIC_KEYS.length; i++) {
        try {
          return await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params, EMAILJS_PUBLIC_KEYS[i]);
        } catch (e) {
          ultimoError = e;
          var msg = ((e && e.text) || "").toLowerCase();
          if (msg.indexOf("account not found") === -1) break;
        }
      }
      throw ultimoError;
    }

    function textoError(e) {
      if (!e) return "desconocido";
      if (e.code === 'timeout') return "el servidor no respondió, revisa tu internet";
      if (e.code === 'red') return "sin conexión a internet";
      if (e.status === 403) return "sin permiso en la base de datos (revisa las reglas de Firestore)";
      if (e.status === 404) return "no se encontró en la base de datos";
      return e.text || e.apiMessage || e.message || String(e);
    }

    function mensajeLogin(e) {
      if (e.code === 'timeout') return "Sin respuesta. Revisa tu internet e inténtalo de nuevo.";
      if (e.code === 'red') return "Sin conexión a internet. Inténtalo de nuevo.";
      var m = (e.apiMessage || e.message || "").toUpperCase();
      if (m.indexOf("INVALID_LOGIN_CREDENTIALS") >= 0 || m.indexOf("INVALID_PASSWORD") >= 0 || m.indexOf("EMAIL_NOT_FOUND") >= 0)
        return "Correo o contraseña incorrectos.";
      if (m.indexOf("TOO_MANY_ATTEMPTS") >= 0) return "Demasiados intentos. Espera unos minutos.";
      if (m.indexOf("OPERATION_NOT_ALLOWED") >= 0) return "El acceso con correo y contraseña no está activado en Firebase.";
      if (m.indexOf("USER_DISABLED") >= 0) return "Este usuario está deshabilitado.";
      return "Error: " + (e.apiMessage || e.message || "desconocido");
    }

    // ---------- LOGIN ----------
    async function procesarLogin() {
      var emailValue = document.getElementById('email').value.trim().toLowerCase();
      var passwordValue = document.getElementById('password').value;
      var errorDiv = document.getElementById('error-message');
      var btn = document.getElementById('btn-submit-login');

      if (!emailValue || !passwordValue) { alert("Por favor ingrese correo y contraseña."); return; }

      btn.disabled = true;
      btn.innerText = "Verificando...";
      errorDiv.innerText = "";

      try {
        await iniciarSesionApi(emailValue, passwordValue, modoAprobar ? 'coordinador' : 'tecnico');
        document.getElementById('password').value = "";
        if (window.alIniciarSesion) window.alIniciarSesion();
      } catch (e) {
        errorDiv.innerText = mensajeLogin(e);
        console.log(e);
      }
      btn.disabled = false;
      btn.innerText = "Iniciar Sesión";
    }

    document.addEventListener("DOMContentLoaded", function() {
      var diag = document.getElementById('diag');
      if (diag) {
        diag.innerText = "v5 | firma: " + (window.SignaturePad ? "ok" : "NO") +
          " | pdf: " + (window.html2pdf ? "ok" : "NO") +
          " | email: " + (window.emailjs ? "ok" : "NO") +
          " | red: " + (navigator.onLine ? "ok" : "NO");
      }

      var loginScreen = document.getElementById('login-screen');
      var mainScreen = document.getElementById('main-form-screen');
      var userDisplay = document.getElementById('user-display');
      var btnSubmit = document.getElementById('btn-submit-main');
      var badge = document.getElementById('view-badge');
      var titulo = document.getElementById('view-title');

      var canvasTech = document.getElementById('signature-tech');
      var canvasAdmin = document.getElementById('signature-admin');
      var imgTechSig = document.getElementById('img-tech-sig');
      var imgAdminSig = document.getElementById('img-admin-sig');
      var clientInput = document.getElementById('client-name');
      var workInput = document.getElementById('work-description');
      var btnClearTech = document.getElementById('btn-clear-tech');
      var btnClearAdmin = document.getElementById('btn-clear-admin');
      var blockAdmin = document.getElementById('block-admin-sig');
      var homeCoord = document.getElementById('home-coord');

      var datosReporte = null;      // datos cargados desde la base de datos
      var vistaFinal = false;       // true = reporte ya aprobado (solo lectura)
      var aprobadoGuardado = false; // true = la firma del coordinador ya quedó guardada
      var infoAprobacion = null;
      var cargaFallida = false;

      function resizeCanvas(canvas, pad) {
        if (!canvas || canvas.classList.contains('hidden')) return;
        var ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        if (pad) pad.clear();
      }

      // Muestra los datos del técnico (solo lectura: el coordinador NO puede cambiarlos)
      function ponerDatosTecnico(d) {
        clientInput.value = d.cliente || '';
        workInput.value = d.detalle || '';
        clientInput.disabled = true;
        workInput.disabled = true;
        workInput.style.height = 'auto';
        workInput.style.height = workInput.scrollHeight + 'px';

        canvasTech.classList.add('hidden');
        btnClearTech.classList.add('hidden');
        imgTechSig.src = d.firmaTec || '';
        imgTechSig.classList.remove('hidden');
        pintarFechas(d.fecha, d.hora, d.fechaApr, d.horaApr);
      }

      function mostrarSoloLectura(d) {
        vistaFinal = true;
        ponerDatosTecnico(d);
        badge.innerText = "Reporte aprobado";
        titulo.innerText = "Reporte de Servicio";
        blockAdmin.classList.remove('hidden');
        canvasAdmin.classList.add('hidden');
        btnClearAdmin.classList.add('hidden');
        imgAdminSig.src = d.firmaAdm || '';
        imgAdminSig.classList.remove('hidden');
        btnSubmit.innerText = "Descargar PDF";
        btnSubmit.style.background = "#2563eb";
      }

      function mostrarParaFirmar(d) {
        ponerDatosTecnico(d);
        badge.innerText = "Modo Coordinador";
        titulo.innerText = "Aprobación de Servicio";
        blockAdmin.classList.remove('hidden');
        btnSubmit.innerText = "Firmar y Enviar a Correo";
        btnSubmit.style.background = "#2563eb";
        if (window.SignaturePad && !padAdmin) {
          padAdmin = new SignaturePad(canvasAdmin, { backgroundColor: 'rgba(0,0,0,0)', penColor: 'rgb(220, 38, 38)' });
          setTimeout(function() { resizeCanvas(canvasAdmin, padAdmin); }, 300);
        }
      }

      function fallaCarga(texto, detalle) {
        cargaFallida = true;
        userDisplay.innerText = texto;
        badge.innerText = "Sin cargar";
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Reintentar";
        btnSubmit.style.background = "#6b7280";
        alert(detalle);
      }

      // ----- Técnico: pantallas -----
      function mostrarLogin() {
        mainScreen.classList.add('hidden');
        homeCoord.classList.add('hidden');
        loginScreen.classList.remove('hidden');
        document.getElementById('login-title').innerText = "Acceso de Técnicos";
        document.getElementById('login-nota').innerText = "";
      }

      function pedirLoginCoordinador() {
        mainScreen.classList.add('hidden');
        homeCoord.classList.add('hidden');
        loginScreen.classList.remove('hidden');
        document.getElementById('login-title').innerText = "Acceso del Coordinador";
        document.getElementById('login-nota').innerText = "Inicia sesión para aprobar el reporte.";
      }

      function mostrarHomeCoord(mensaje) {
        loginScreen.classList.add('hidden');
        mainScreen.classList.add('hidden');
        homeCoord.classList.remove('hidden');
        document.getElementById('home-coord-msg').innerText = mensaje || "";
      }

      function iniciarPadTecnico() {
        if (!padTech && canvasTech && window.SignaturePad) {
          padTech = new SignaturePad(canvasTech, { backgroundColor: 'rgba(0,0,0,0)', penColor: 'rgb(0, 0, 128)' });
          setTimeout(function() { resizeCanvas(canvasTech, padTech); }, 300);
        }
      }

      function mostrarFormularioTecnico() {
        loginScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        userDisplay.innerText = sesion ? sesion.email : '';
        iniciarPadTecnico();
      }

      // Carga el reporte desde la base de datos (coordinador o visor)
      function cargarReporte() {
        loginScreen.classList.add('hidden');
        homeCoord.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        // El botón Salir solo aparece para el coordinador (el visor del correo no inicia sesión)
        document.getElementById('btn-logout').classList.toggle('hidden', !modoAprobar);
        userDisplay.innerText = "Cargando reporte...";
        badge.innerText = "Cargando...";
        btnSubmit.disabled = true;
        btnSubmit.innerText = "Cargando...";
        btnSubmit.style.background = "#6b7280";

        if (!reporteId) {
          fallaCarga("Enlace no válido", "Este enlace es de una versión anterior. Pide al técnico que envíe el reporte de nuevo.");
          return;
        }
        leerReporte(reporteId).then(function(d) {
          datosReporte = d;
          btnSubmit.disabled = false;
          if (modoVer || d.estado === 'aprobado') {
            userDisplay.innerText = (sesion && modoAprobar) ? sesion.email : "Reporte firmado";
            mostrarSoloLectura(d);
          } else {
            userDisplay.innerText = sesion ? sesion.email : "Coordinador";
            mostrarParaFirmar(d);
          }
        }).catch(function(e) {
          fallaCarga("Error al cargar", "No se pudo cargar el reporte: " + textoError(e));
        });
      }

      window.alIniciarSesion = function() {
        if (modoAprobar) cargarReporte();
        else mostrarFormularioTecnico();
      };

      if (modoVer) {
        // ----- Visor del correo: solo lectura, sin login -----
        cargarReporte();
      } else if (modoAprobar) {
        // ----- Coordinador: debe iniciar sesión (una vez; luego sigue activa) -----
        sesion = leerSesion();
        if (sesion && sesion.refreshToken) cargarReporte();
        else pedirLoginCoordinador();
      } else {
        // ----- Técnico: si ya inició sesión antes, entra directo -----
        sesion = leerSesion();
        if (sesion && sesion.refreshToken) {
          if (sesion.rol === 'coordinador') mostrarHomeCoord("");
          else mostrarFormularioTecnico();
        } else mostrarLogin();
      }

      btnClearTech.onclick = function() { if (padTech) padTech.clear(); };
      btnClearAdmin.onclick = function() { if (padAdmin) padAdmin.clear(); };

      async function descargarPDF() {
        btnSubmit.disabled = true;
        var textoOriginal = btnSubmit.innerText;
        btnSubmit.innerText = "Generando PDF...";
        try {
          await new Promise(function(r) { setTimeout(r, 400); }); // deja cargar las firmas
          var nombre = ((datosReporte && datosReporte.cliente) || 'servicio').replace(/[^\w\-]+/g, '_');
          await html2pdf().set({ margin: 10, filename: 'Reporte_' + nombre + '.pdf', html2canvas: { scale: 2, useCORS: true } })
            .from(document.getElementById('pdf-area')).save();
        } catch (e) {
          alert("No se pudo generar el PDF: " + (e.message || e));
        }
        btnSubmit.disabled = false;
        btnSubmit.innerText = textoOriginal;
      }

      btnSubmit.onclick = async function() {
        if (cargaFallida) { window.location.reload(); return; }
        // ----- Reporte ya aprobado: solo descargar -----
        if (modoVer || vistaFinal) { descargarPDF(); return; }

        if (!modoAprobar) {
          // ----- TÉCNICO: guarda el reporte y abre WhatsApp con un enlace corto -----
          if (!padTech || padTech.isEmpty()) { alert("Firma requerida."); return; }
          if (!clientInput.value || !workInput.value) { alert("Complete todos los campos del reporte."); return; }

          btnSubmit.disabled = true;
          btnSubmit.innerText = "Guardando reporte...";
          try {
            var t = ahora();
            var id = await crearReporte({
              cliente: clientInput.value,
              detalle: workInput.value,
              fecha: t.fecha,
              hora: t.hora,
              firmaTec: firmaImagen(canvasTech, 400, 0.7),
              estado: 'pendiente',
              tecnico: sesion ? sesion.email : ''
            });

            var link = baseUrl + "?mode=aprobar&id=" + id;
            var texto = "*REPORTE TÉCNICO*\nCliente: " + clientInput.value +
                        "\nFecha: " + t.fecha + " " + t.hora +
                        "\nEnlace de aprobación: " + link;
            var waUrl = "https://wa.me/" + WHATSAPP_COORDINADOR + "?text=" + encodeURIComponent(texto);

            // Deja el formulario limpio para otro reporte
            clientInput.value = "";
            workInput.value = "";
            padTech.clear();
            btnSubmit.innerText = "¡Enviado! Puedes hacer otro reporte";
            setTimeout(function() { btnSubmit.innerText = "Enviar a WhatsApp"; }, 4000);

            var w = window.open(waUrl, "_blank");
            if (!w) window.location.href = waUrl;
          } catch (e) {
            if (e.code === 'sin-sesion' || e.status === 401) {
              alert("Tu sesión venció. Inicia sesión otra vez (lo que escribiste no se pierde).");
              guardarSesion(null);
              mostrarLogin();
            } else {
              alert("No se pudo guardar el reporte: " + textoError(e));
            }
            btnSubmit.innerText = "Enviar a WhatsApp";
          }
          btnSubmit.disabled = false;
        } else {
          // ----- COORDINADOR: firma, guarda y envía el correo -----
          if (!padAdmin || padAdmin.isEmpty()) { alert("Falta tu firma."); return; }
          btnSubmit.disabled = true;
          btnSubmit.innerText = "Enviando...";
          try {
            if (!aprobadoGuardado) {
              var a = ahora();
              await firmarReporte(reporteId, {
                firmaAdm: firmaImagen(canvasAdmin, 400, 0.7),
                fechaApr: a.fecha,
                horaApr: a.hora,
                estado: 'aprobado'
              });
              aprobadoGuardado = true;
              infoAprobacion = a;
              pintarFechas(datosReporte.fecha, datosReporte.hora, a.fecha, a.hora);
            }

            if (!window.emailjs) throw new Error("EmailJS no cargó");
            var linkReporte = baseUrl + "?mode=ver&id=" + reporteId;
            await enviarCorreo({
              to_email: CORREOS_DESTINO,
              cliente: datosReporte.cliente,
              detalle: datosReporte.detalle,
              fecha_reporte: datosReporte.fecha || '',
              hora_reporte: datosReporte.hora || '',
              fecha_aprobacion: infoAprobacion.fecha,
              hora_aprobacion: infoAprobacion.hora,
              link_reporte: linkReporte
            });

            alert("¡Reporte aprobado y enviado con éxito!");
            try { history.replaceState(null, '', baseUrl); } catch (e) {}
            mostrarHomeCoord("✔ Reporte aprobado y enviado con éxito.");
            btnSubmit.disabled = false;
          } catch (err) {
            if (!aprobadoGuardado && (err.code === 'sin-sesion' || err.status === 401)) {
              alert("Tu sesión venció. Inicia sesión otra vez para aprobar este reporte.");
              guardarSesion(null);
              pedirLoginCoordinador();
              btnSubmit.disabled = false;
              btnSubmit.innerText = "Firmar y Enviar a Correo";
              return;
            }
            if (aprobadoGuardado) {
              alert("Tu firma quedó guardada, pero el correo no salió: " + textoError(err) +
                    "\n\nToca el botón para reintentar el envío del correo.");
              btnSubmit.innerText = "Reintentar envío de correo";
            } else {
              alert("No se pudo guardar la firma: " + textoError(err));
              btnSubmit.innerText = "Firmar y Enviar a Correo";
            }
            btnSubmit.disabled = false;
          }
        }
      };

      document.getElementById('btn-logout').onclick = function() {
        guardarSesion(null);
        if (modoAprobar) pedirLoginCoordinador();
        else mostrarLogin();
      };

      document.getElementById('btn-logout-home').onclick = function() {
        guardarSesion(null);
        mostrarLogin();
      };
    });
  </script>
</body>
</html>
