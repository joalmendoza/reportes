<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistema de Reportes Técnicos</title>
  
  <link rel="stylesheet" href="style.css">

  <!-- CARGA PRIORITARIA DE LIBRERÍAS DE ACCIÓN EXTERNAS -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://jsdelivr.net"></script>

  <!-- CARGA PRIORITARIA Y COMPATIBLE DE FIREBASE CORE CLÁSICO -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
</head>
<body>

  <!-- PANTALLA 1: INICIO DE SESIÓN -->
  <div id="login-screen" class="card">
    <h2 style="text-align: center; margin-bottom: 20px;">Acceso de Técnicos</h2>
    <div id="error-message" class="error-msg"></div>
    
    <form id="login-form">
      <label style="font-weight: bold; font-size: 14px;">Correo Electrónico</label>
      <input type="email" id="email" class="input-field" placeholder="correo@empresa.com" required>
      
      <label style="font-weight: bold; font-size: 14px;">Contraseña</label>
      <input type="password" id="password" class="input-field" placeholder="••••••••" required>
      
      <button type="submit" class="btn">Iniciar Sesión</button>
    </form>
  </div>

  <!-- PANTALLA 2: FORMULARIO DINÁMICO (TÉCNICO / APROBACIÓN) -->
  <div id="main-form-screen" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px;">
      <span style="font-size: 12px; color: #6b7280; font-weight: bold;" id="user-display">Modo Consulta</span>
      <button id="btn-logout" style="background: none; border: none; color: #ef4444; font-size: 12px; font-weight: bold; cursor: pointer;">Salir</button>
    </div>

    <div id="view-badge" class="badge">Modo Técnico</div>
    <h2 id="view-title" style="margin-top: 0; margin-bottom: 16px; color: #111827;">Formulario de Servicio</h2>
    
    <div id="pdf-area" style="padding: 10px; background: white;">
      <label style="font-weight: bold; font-size: 14px;">Nombre del Cliente</label>
      <input type="text" id="client-name" class="input-field" required>

      <label style="font-weight: bold; font-size: 14px;">Descripción del Trabajo Realizado</label>
      <textarea id="work-description" class="input-field" rows="4" style="resize: none; font-family: sans-serif;" required></textarea>

      <!-- Bloque Firma Técnico -->
      <div id="block-tech-sig">
        <label style="font-weight: bold; font-size: 14px;">Firma del Técnico</label>
        <div class="canvas-container" id="container-canvas-tech">
          <canvas id="signature-tech"></canvas>
          <img id="img-tech-sig" class="hidden" style="width: 100%; height: 150px; object-fit: contain;" alt="Firma Técnico">
        </div>
        <button type="button" id="btn-clear-tech" class="btn-clear">Borrar Firma</button>
      </div>

      <!-- Bloque Firma Administrador -->
      <div id="block-admin-sig" class="hidden">
        <label style="font-weight: bold; font-size: 14px; color: #2563eb;">Firma de Aprobación (Administrador)</label>
        <div class="canvas-container">
          <canvas id="signature-admin"></canvas>
        </div>
        <button type="button" id="btn-clear-admin" class="btn-clear">Borrar Firma Admin</button>
      </div>
    </div>

    <button id="btn-submit-main" class="btn" style="background: #16a34a;">Enviar a WhatsApp</button>
  </div>

  <!-- SE AGREGA EL ATRIBUTO DEFER PARA ESPERAR LA DESCARGA DE LIBRERÍAS EXTERNAS -->
  <script src="app.js" defer></script>
</body>
</html>
