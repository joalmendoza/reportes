<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Depuración Pura de Usuarios</title>
  
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; text-align: center; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
    .hidden { display: none !important; }
    .input-field { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 16px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    .btn { width: 100%; background: #2563eb; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn-danger { background: #ef4444; margin-top: 20px; }
    .error-msg { color: #ef4444; font-weight: bold; margin-bottom: 12px; font-size: 14px; }
    .success-box { color: #10b981; }
  </style>

  <!-- LIBRERÍAS OFICIALES DE GOOGLE FIREBASE CLÁSICO DESDE CDN DE GOOGLE -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
</head>
<body>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="card">
    
    <!-- PANTALLA 1: INICIO DE SESIÓN -->
    <div id="screen-login">
      <h2>Paso 1: Validar Usuario</h2>
      <div id="error-message" class="error-msg"></div>
      
      <div>
        <label style="font-weight: bold; font-size: 14px; display: block; text-align: left;">Correo Electrónico</label>
        <input type="email" id="email" class="input-field" placeholder="correo@empresa.com">
        
        <label style="font-weight: bold; font-size: 14px; display: block; text-align: left;">Contraseña</label>
        <input type="password" id="password" class="input-field" placeholder="••••••••">
        
        <button type="button" id="btn-submit-login" class="btn" onclick="ejecutarAutenticacion()">Conectar con Firebase</button>
      </div>
    </div>

    <!-- PANTALLA 2: METAS LOGRADAS (PANTALLA DE ÉXITO) -->
    <div id="screen-success" class="hidden success-box">
      <svg xmlns="http://w3.org" style="height: 64px; width: 64px; margin: 0 auto 16px auto;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <h2>¡Lo logramos!</h2>
      <p style="font-size: 18px; font-weight: 500; color: #374151;">El control de usuarios funciona perfectamente teniendo en cuenta Firebase.</p>
      <p id="user-connected" style="font-weight: bold; background: #f3f4f6; padding: 10px; border-radius: 8px; margin-top: 15px; color: #1f2937;"></p>
      
      <button type="button" class="btn btn-danger" onclick="cerrarSesionPrueba()">Cerrar Sesión de Prueba</button>
    </div>

  </div>

  <!-- CONTROL DE EVENTOS JAVASCRIPT DIRECTO -->
  <script>
    // Configuración de tu base de datos AppFormatosMtto
    const firebaseConfig = {
      apiKey: "AIzaSyAWSDgj6gQjGyOYblCIBXKC15s7Y7qnnsA",
      authDomain: "://firebaseapp.com",
      projectId: "appformatosmtto",
      storageBucket: "appformatosmtto.firebasestorage.app",
      messagingSenderId: "729388358915",
      appId: "1:729388358915:web:d6db0be41af4e60a5c5d36"
    };

    let auth;

    // Inicializar Firebase de forma aislada
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
    } else {
      alert("Error grave: Las librerías de Google Firebase no se cargaron en el móvil.");
    }

    // Monitoreo en tiempo real del estado de sesión
    document.addEventListener("DOMContentLoaded", () => {
      if (auth) {
        auth.onAuthStateChanged((user) => {
          const loginScreen = document.getElementById('screen-login');
          const successScreen = document.getElementById('screen-success');
          const userConnectedText = document.getElementById('user-connected');

          if (user) {
            // Si el usuario ingresa de forma correcta, cambiamos de pantalla inmediatamente
            loginScreen.classList.add('hidden');
            successScreen.classList.remove('hidden');
            userConnectedText.innerText = "Conectado como: " + user.email;
          } else {
            // Si no está logueado, regresamos al formulario limpio
            successScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
          }
        });
      }
    });

    // Función manual que se activa al presionar el botón azul
    function ejecutarAutenticacion() {
      const emailValue = document.getElementById('email').value.trim().toLowerCase();
      const passwordValue = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      const actionButton = document.getElementById('btn-submit-login');

      if (!emailValue || !passwordValue) {
        alert("Por favor introduce los datos completos de tu técnico de prueba.");
        return;
      }

      actionButton.disabled = true;
      actionButton.innerText = "Consultando base de datos de Google...";

      // Petición directa a los servidores de Firebase
      auth.signInWithEmailAndPassword(emailValue, passwordValue)
        .then(() => {
          errorDiv.innerText = "";
          alert("¡Firebase dice: Acceso Concedido!");
        })
        .catch((error) => {
          actionButton.disabled = false;
          actionButton.innerText = "Conectar con Firebase";
          errorDiv.innerText = "Fallo de ingreso: Credenciales inválidas.";
          alert("RECHAZADO POR GOOGLE FIREBASE:\n\nMensaje: " + error.message);
        });
    }

    // Función para limpiar la prueba y volver a empezar
    function cerrarSesionPrueba() {
      if (auth) {
        auth.signOut().then(() => {
          alert("Sesión cerrada.");
        });
      }
    }
  </script>
</body>
</html>
