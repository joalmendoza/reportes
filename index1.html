<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistema de Reportes Técnicos</title>
  
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; }
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
    .hidden { display: none !important; }
    .input-field { width: 100%; padding: 12px; margin-top: 4px; margin-bottom: 16px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    .btn { width: 100%; background: #2563eb; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .canvas-container { border: 2px dashed #9ca3af; border-radius: 8px; background: #fafafa; position: relative; margin-bottom: 8px; touch-action: none; }
    canvas { width: 100%; height: 150px; display: block; border-radius: 8px; }
    .btn-clear { background: #6b7280; padding: 6px 12px; font-size: 12px; margin-bottom: 16px; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .error-msg { color: #ef4444; font-weight: bold; margin-bottom: 12px; font-size: 14px; text-align: center; }
    .badge { display: inline-block; padding: 4px 8px; background: #e0f2fe; color: #0369a1; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
  </style>

  <!-- LIBRERÍAS DE ACCIÓN EXTERNAS ALTERNATIVAS -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://jsdelivr.net"></script>

  <!-- ENLACES DE FIREBASE CLÁSICO DESDE CLOUDFLARE -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>

  <!-- LÓGICA DE CONTROL DE ALTA PRIORIDAD -->
  <script>
    // Capturador total de errores
    window.onerror = function(message, source, lineno) {
      alert("Error en ejecución: " + message + "\nLínea: " + lineno);
      return false;
    };

    const firebaseConfig = {
      apiKey: "AIzaSyAWSDgj6gQjGyOYblCIBXKC15s7Y7qnnsA",
      authDomain: "://firebaseapp.com",
      projectId: "appformatosmtto",
      storageBucket: "appformatosmtto.firebasestorage.app",
      messagingSenderId: "729388358915",
      appId: "1:729388358915:web:d6db0be41af4e60a5c5d36"
    };

    let auth, padTech, padAdmin;
    let urlParams = new URLSearchParams(window.location.search);
    let modoAprobar = urlParams.get('mode') === 'aprobar';

    // Inicializar Firebase inmediatamente
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
    }

    if (window.emailjs) {
      emailjs.init("l_6FNZetkO_cSgx5A");
    }

    // Función nativa e independiente para procesar el inicio de sesión
    function procesarLogin() {
      alert("Botón presionado. Leyendo datos...");
      
      const emailValue = document.getElementById('email').value.trim().toLowerCase();
      const passwordValue = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');

      if (!emailValue || !passwordValue) {
        alert("Atención: Por favor digite su correo y contraseña.");
        return;
      }

      alert("Intentando conectar con Firebase para el usuario: " + emailValue);

      auth.signInWithEmailAndPassword(emailValue, passwordValue)
        .then((userCredential) => {
          alert("¡Autenticación Exitosa de Google Firebase! Entrando al formulario...");
        })
        .catch((error) => {
          alert("RECHAZADO POR FIREBASE:\nCódigo: " + error.code + "\nMensaje: " + error.message);
          errorDiv.innerText = "Error: " + error.message;
        });
    }

    // Control dinámico de pantallas al cargar la interfaz
    document.addEventListener("DOMContentLoaded", () => {
      const loginScreen = document.getElementById('login-screen');
      const mainScreen = document.getElementById('main-form-screen');
      const userDisplay = document.getElementById('user-display');
      const btnSubmit = document.getElementById('btn-submit-main');
      
      const canvasTech = document.getElementById('signature-tech');
      const canvasAdmin = document.getElementById('signature-admin');
      const imgTechSig = document.getElementById('img-tech-sig');
      const clientInput = document.getElementById('client-name');
      const workInput = document.getElementById('work-description');

      function resizeCanvas(canvas, pad) {
        if (!canvas || canvas.classList.contains('hidden')) return;
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        if (pad) pad.clear();
      }

      if (modoAprobar) {
        loginScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        userDisplay.innerText = "Administrador";
        clientInput.value = urlParams.get('cliente') || '';
        workInput.value = urlParams.get('detalle') || '';
        clientInput.disabled = true;
        workInput.disabled = true;
        canvasTech.classList.add('hidden');
        document.getElementById('btn-clear-tech').classList.add('hidden');
        imgTechSig.classList.remove('hidden');
        imgTechSig.src = urlParams.get('techSig') || '';
        document.getElementById('block-admin-sig').classList.remove('hidden');
        btnSubmit.innerText = "Firmar y Enviar PDF";
        btnSubmit.style.background = "#2563eb";

        if (window.SignaturePad) {
          padAdmin = new SignaturePad(canvasAdmin, { backgroundColor: 'rgba(0,0,0,0)', penColor: 'rgb(220, 38, 38)' });
          setTimeout(() => resizeCanvas(canvasAdmin, padAdmin), 300);
        }
      } else {
        auth.onAuthStateChanged((user) => {
          if (user) {
            loginScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            userDisplay.innerText = user.email;
            if (!padTech && canvasTech && window.SignaturePad) {
              padTech = new SignaturePad(canvasTech, { backgroundColor: 'rgba(0,0,0,0)', penColor: 'rgb(0, 0, 128)' });
              setTimeout(() => resizeCanvas(canvasTech, padTech), 300);
            }
          } else {
            mainScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
          }
        });
      }

      document.getElementById('btn-clear-tech').addEventListener('click', () => padTech && padTech.clear());
      document.getElementById('btn-clear-admin').addEventListener('click', () => padAdmin && padAdmin.clear());

      btnSubmit.addEventListener('click', async () => {
        if (!modoAprobar) {
          if (!padTech || padTech.isEmpty()) { alert("Firma requerida."); return; }
          if (!clientInput.value || !workInput.value) { alert("Llena cliente y descripción."); return; }

          const base64TechSig = encodeURIComponent(padTech.toDataURL());
          const link = `${window.location.origin}${window.location.pathname}?mode=aprobar&cliente=${encodeURIComponent(clientInput.value)}&detalle=${encodeURIComponent(workInput.value)}&techSig=${base64TechSig}`;
          window.open(`https://wa.me TÉCNICO*%0ACliente: ${clientInput.value}%0A${link}`, '_blank');
        } else {
          if (!padAdmin || padAdmin.isEmpty()) { alert("Falta firma admin."); return; }
          btnSubmit.disabled = true;
          try {
            const pdfBase64 = await html2pdf().set({ margin: 10, filename: 'Reporte.pdf' }).from(document.getElementById('pdf-area')).outputPdf('datauristring');
            await emailjs.send("service_m3xvu2j", "template_loi9vam", { cliente: urlParams.get('cliente'), detalle: urlParams.get('detalle'), content_pdf: pdfBase64 });
            alert("Enviado por EmailJS");
            window.location.href = window.location.origin + window.location.pathname;
          } catch (err) {
            alert("Error EmailJS: " + err.message);
            btnSubmit.disabled = false;
          }
        }
      });

      document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());
    });
  </script>
</head>
<body>

  <!-- PANTALLA 1: INICIO DE SESIÓN -->
  <div id="login-screen" class="card">
    <h2 style="text-align: center; margin-bottom: 20px;">Acceso de Técnicos</h2>
    <div id="error-message" class="error-msg"></div>
    
    <div>
      <label style="font-weight: bold; font-size: 14px;">Correo Electrónico</label>
      <input type="email" id="email" class="input-field" placeholder="correo@empresa.com">
      
      <label style="font-weight: bold; font-size: 14px;">Contraseña</label>
      <input type="password" id="password" class="input-field" placeholder="••••••••">
      
      <!-- Se enlaza mediante un disparador de clic nativo a prueba de fallos -->
      <button type="button" id="btn-submit-login" class="btn" onclick="procesarLogin()">Iniciar Sesión</button>
    </div>
  </div>

  <!-- PANTALLA 2: FORMULARIO DINÁMICO -->
  <div id="main-form-screen" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px;">
      <span style="font-size: 12px; color: #6b7280; font-weight: bold;" id="user-display">Modo Consulta</span>
