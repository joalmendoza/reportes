<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Depuración Conexión Firebase</title>
  
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; text-align: center; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
    .hidden { display: none !important; }
    .input-field { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 16px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    .btn { width: 100%; background: #2563eb; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn-danger { background: #ef4444; margin-top: 20px; }
    .error-msg { color: #ef4444; font-weight: bold; margin-bottom: 12px; font-size: 14px; }
    .success-box { color: #10b981; }
  </style>

  <!-- Capturador de errores globales de Javascript -->
  <script>
    window.onerror = function(message, source, lineno) {
      alert("Error de Sistema: " + message + "\nLínea: " + lineno);
      return false;
    };
  </script>

  <!-- LIBRERÍAS CLÁSICAS DE FIREBASE DESDE SERVIDORES DE RESPALDO GLOBAL -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
</head>
<body>

  <div class="card">
    <!-- PANTALLA 1: INICIO DE SESIÓN -->
    <div id="screen-login">
      <h2>Prueba de Conexión Real</h2>
      <div id="error-message" class="error-msg"></div>
      
      <div>
        <label style="font-weight: bold; font-size: 14px; display: block; text-align: left;">Correo Electrónico</label>
        <input type="email" id="email" class="input-field" placeholder="correo@empresa.com" value="joalmendoza@gmail.com">
        
        <label style="font-weight: bold; font-size: 14px; display: block; text-align: left;">Contraseña</label>
        <input type="password" id="password" class="input-field" placeholder="••••••••">
        
        <button type="button" id="btn-submit-login" class="btn" onclick="probarAccesoReal()">Validar en Firebase Real</button>
      </div>
    </div>

    <!-- PANTALLA 2: CONTROL EXCELENTE -->
    <div id="screen-success" class="hidden success-box">
      <svg xmlns="http://w3.org" style="height: 64px; width: 64px; margin: 0 auto 16px auto;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <h2>¡CONEXIÓN INTERNET OK!</h2>
      <p style="font-size: 16px; color: #374151;">Tu celular logró romper el bloqueo, viajó a los servidores de Google y validó al usuario.</p>
      <p id="user-connected" style="font-weight: bold; background: #f3f4f6; padding: 10px; border-radius: 8px; margin-top: 15px; color: #1f2937;"></p>
      
      <button type="button" class="btn btn-danger" onclick="cerrarSesionPrueba()">Cerrar Sesión</button>
    </div>
  </div>

  <script>
    // Configuración vinculada a tu proyecto AppFormatosMtto
    const firebaseConfig = {
      apiKey: "AIzaSyAWSDgj6gQjGyOYblCIBXKC15s7Y7qnnsA",
      authDomain: "://firebaseapp.com",
      projectId: "appformatosmtto",
      storageBucket: "appformatosmtto.firebasestorage.app",
      messagingSenderId: "729388358915",
      appId: "1:729388358915:web:d6db0be41af4e60a5c5d36"
    };

    let auth;

    // Intentar encender el motor real de Google
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
    } else {
      alert("Diagnóstico: El script base de Firebase sigue bloqueado en la red actual de este celular.");
    }

    // Escucha en tiempo real de Google Firebase
    document.addEventListener("DOMContentLoaded", () => {
      if (auth) {
        auth.onAuthStateChanged((user) => {
          const loginScreen = document.getElementById('screen-login');
          const successScreen = document.getElementById('screen-success');
          const userConnectedText = document.getElementById('user-connected');

          if (user) {
            loginScreen.classList.add('hidden');
            successScreen.classList.remove('hidden');
            userConnectedText.innerText = "Conectado real: " + user.email;
          } else {
            successScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
          }
        });
      }
    });

    // Función de envío directo a internet
    function probarAccesoReal() {
      const emailValue = document.getElementById('email').value.trim().toLowerCase();
      const passwordValue = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      const actionButton = document.getElementById('btn-submit-login');

      if (!emailValue || !passwordValue) {
        alert("Por favor introduce los datos completos.");
        return;
      }

      if (!auth) {
        alert("Error: No se puede realizar la consulta porque las librerías de Google están inactivas en el dispositivo.");
        return;
      }

      actionButton.disabled = true;
      actionButton.innerText = "Enviando datos a Google Firebase...";

      // Intentar el inicio de sesión real en los servidores de Google
      auth.signInWithEmailAndPassword(emailValue, passwordValue)
        .then((userCredential) => {
          alert("¡RESPUESTA EXITOSA!\n\nGoogle Firebase validó tus credenciales y concedió el acceso.");
        })
        .catch((error) => {
          actionButton.disabled = false;
          actionButton.innerText = "Validar en Firebase Real";
          errorDiv.innerText = "Error: " + error.message;
          
          // Alerta con el código de error exacto que responde Google
          alert("RESPUESTA NEGATIVA DE FIREBASE:\n\nCódigo: " + error.code + "\nMensaje: " + error.message);
        });
    }

    function cerrarSesionPrueba() {
      if (auth) {
        auth.signOut().then(() => {
          document.getElementById('btn-submit-login').disabled = false;
          document.getElementById('btn-submit-login').innerText = "Validar en Firebase Real";
        });
      }
    }
  </script>
</body>
</html>
